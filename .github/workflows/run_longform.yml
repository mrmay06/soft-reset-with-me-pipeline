name: Soft Reset Weekly Long Video

on:
  schedule:
    # Saturday 6:00 AM America/New_York, with a timezone gate for DST.
    - cron: '0 10 * * 6'
    - cron: '0 11 * * 6'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Run an offline mock render.'
        required: true
        default: true
        type: boolean

concurrency:
  group: soft-reset-weekly-longform
  cancel-in-progress: false

jobs:
  run-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check automation and DST gate
        id: gate
        shell: python
        run: |
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          config = json.load(open('config/longform_config.json'))
          now = datetime.now(ZoneInfo('America/New_York'))
          enabled = bool(config.get('automation_enabled', False))
          should_run = event != 'schedule' or (enabled and now.weekday() == 5 and now.hour == 6)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"should_run={str(should_run).lower()}\n")
          print(f"should_run={should_run} automation_enabled={enabled} local={now.isoformat()}")
      - if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.should_run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt
      - name: Generate scheduled-public long video
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mock }}" = "true" ]; then
            python main_long.py --mock --fresh
          else
            python main_long.py --fresh
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
      - name: Upload run artifacts
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: soft-reset-long-${{ github.run_id }}
          path: workspace/run_long_*/
          if-no-files-found: warn
          retention-days: 7
