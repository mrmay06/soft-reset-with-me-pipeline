name: Soft Reset Daily Shorts

on:
  schedule:
    # 6:00 AM America/New_York, with a timezone gate for DST.
    - cron: '0 10 * * 0'
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 2'
    - cron: '0 10 * * 3'
    - cron: '0 10 * * 4'
    - cron: '0 10 * * 5'
    - cron: '0 10 * * 6'
    - cron: '0 11 * * 0'
    - cron: '0 11 * * 1'
    - cron: '0 11 * * 2'
    - cron: '0 11 * * 3'
    - cron: '0 11 * * 4'
    - cron: '0 11 * * 5'
    - cron: '0 11 * * 6'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Run an offline mock render.'
        required: true
        default: true
        type: boolean

concurrency:
  group: soft-reset-daily-shorts
  cancel-in-progress: false

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check automation and DST gate
        id: gate
        shell: python
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from utils.github_schedule import should_run as evaluate_schedule
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          schedule = os.environ.get('GITHUB_EVENT_SCHEDULE', '')
          config = json.load(open('config/pipeline_config.json'))
          now = datetime.now(ZoneInfo('America/New_York'))
          enabled = bool(config.get('automation_enabled', False))
          should_run, reason = evaluate_schedule(event, schedule, now, enabled, target_hour_et=6)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"should_run={str(should_run).lower()}\n")
          print(f"should_run={should_run} reason={reason} automation_enabled={enabled} schedule={schedule!r} local={now.isoformat()}")
      - if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.should_run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt
      - name: Validate configuration
        if: steps.gate.outputs.should_run == 'true'
        run: python tools/validate_schedule.py && python tools/validate_memory_files.py
      - name: Generate scheduled-public Short
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mock }}" = "true" ]; then
            python main.py --mock --fresh --skip-upload
          else
            python main.py --fresh
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
      - name: Upload run artifacts
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: soft-reset-short-${{ github.run_id }}
          path: workspace/run_*/
          if-no-files-found: warn
          retention-days: 7
